name: CI - Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cardioia-backend ./backend

      - name: Run smoke tests (with stubs)
        run: |
          docker run --rm -e USE_STUBS=1 cardioia-backend \
            python -m pytest test_smoke.py -v
